name: Bug report
description: Report a reproducible bug in the app, backend, training stack, or release flow
title: "[Bug]: "
labels:
  - bug
body:
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Flutter app
        - Backend API
        - Training stack
        - GitHub Actions / release
        - Solana program
        - Documentation
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
      placeholder: A concise description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Device, OS, branch, tag, commit SHA, runner, or anything else relevant
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste stack traces, logs, screenshots, or links here
