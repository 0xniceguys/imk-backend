name: Flutter Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to release, for example 1.2.3"
        required: true
        type: string
      build_number:
        description: "Optional Flutter build number. Leave blank to auto-increment."
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: flutter-release-${{ github.event_name }}-${{ github.ref_name || inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Flutter Android release
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      FLUTTER_APP_DIR: streaming/flutter_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare main branch for manual release
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "Manual releases must be started from the main branch. Current ref: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git checkout -B main origin/main

      - name: Fetch refs for tag validation
        if: github.event_name == 'push'
        run: git fetch origin +refs/heads/main:refs/remotes/origin/main

      - name: Resolve release metadata
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          pubspec="${FLUTTER_APP_DIR}/pubspec.yaml"
          current_line="$(grep -E '^version:' "$pubspec" | awk '{print $2}')"
          current_version="${current_line%%+*}"
          current_build="${current_line#*+}"

          if [[ -z "$current_line" || -z "$current_version" || -z "$current_build" ]]; then
            echo "Unable to parse Flutter version from ${pubspec}" >&2
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${INPUT_VERSION}"

            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Version must use semantic versioning, for example 1.2.3" >&2
              exit 1
            fi

            if [[ -n "${INPUT_BUILD_NUMBER}" ]]; then
              build_number="${INPUT_BUILD_NUMBER}"
              if [[ ! "$build_number" =~ ^[0-9]+$ ]]; then
                echo "Build number must be numeric." >&2
                exit 1
              fi
            else
              build_number="$((current_build + 1))"
            fi

            tag="v${version}"
            new_line="${version}+${build_number}"

            if git rev-parse "$tag" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "Tag ${tag} already exists." >&2
              exit 1
            fi

            perl -0pi -e "s/^version:\\s+.*/version: ${new_line}/m" "$pubspec"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            if ! git diff --quiet -- "$pubspec"; then
              git add "$pubspec"
              git commit -m "chore(flutter): release ${tag}"
              git push origin HEAD:main
            fi

            git tag -a "$tag" -m "Release ${tag}"
            git push origin "$tag"

            release_sha="$(git rev-parse HEAD)"
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            build_number="${current_build}"

            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Tag-triggered releases require tags in the form v1.2.3" >&2
              exit 1
            fi

            if [[ "$version" != "$current_version" ]]; then
              echo "Tag ${tag} does not match pubspec version ${current_version}" >&2
              exit 1
            fi

            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "Tag ${tag} must point to a commit already contained in origin/main." >&2
              exit 1
            fi

            release_sha="${GITHUB_SHA}"
          fi

          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "build_number=${build_number}"
            echo "release_sha=${release_sha}"
            echo "release_name=Immortal Kombat ${tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.38.9"
          cache: true

      - name: Install Flutter dependencies
        working-directory: ${{ env.FLUTTER_APP_DIR }}
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ env.FLUTTER_APP_DIR }}
        run: flutter build apk --release

      - name: Prepare release asset
        run: |
          mkdir -p release
          cp "${FLUTTER_APP_DIR}/build/app/outputs/flutter-apk/app-release.apk" \
            release/immortal-kombat-android.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortal-kombat-android-${{ steps.meta.outputs.tag }}
          path: release/immortal-kombat-android.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        id: publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ steps.meta.outputs.release_sha }}
          name: ${{ steps.meta.outputs.release_name }}
          body: |
            Android APK release for `${{ steps.meta.outputs.tag }}`.

            Flutter version: `${{ steps.meta.outputs.version }}+${{ steps.meta.outputs.build_number }}`

            Included APK:
            - `immortal-kombat-android.apk`
          files: release/immortal-kombat-android.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          make_latest: true

      - name: Publish run summary
        run: |
          {
            echo "## Flutter Android release"
            echo
            echo "- Tag: \`${{ steps.meta.outputs.tag }}\`"
            echo "- Flutter version: \`${{ steps.meta.outputs.version }}+${{ steps.meta.outputs.build_number }}\`"
            echo "- Release URL: ${{ steps.publish_release.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
