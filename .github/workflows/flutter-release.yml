name: Flutter APK Release

on:
  push:
    tags:
      - 'v*'   # Triggers on version tags like v1.0.0

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (required for Android build)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: Get Flutter dependencies
        working-directory: streaming/flutter_app
        run: flutter pub get

      - name: Build release APK
        working-directory: streaming/flutter_app
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: streaming/flutter_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Immortal Kombat ${{ github.ref_name }}
          body: |
            ## Immortal Kombat ${{ github.ref_name }}

            ### 📱 Android APKs
            Download the APK for your device architecture:
            - `app-arm64-v8a-release.apk` — Most modern Android phones (recommended)
            - `app-armeabi-v7a-release.apk` — Older 32-bit Android devices
            - `app-x86_64-release.apk` — Android emulators / x86 devices

            ### Installation
            1. Download the APK for your device
            2. Enable "Install from unknown sources" in Android settings
            3. Open the APK file to install

          files: streaming/flutter_app/build/app/outputs/flutter-apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
