{% extends "base.html" %}
{% block title %}New Match{% endblock %}

{% block content %}
<h1>Create Match</h1>

{% if error %}
<div class="flash flash-error">{{ error }}</div>
{% endif %}

<div class="card">
  <form method="POST" action="/admin/matches/new">
    <div class="grid grid-2">
      <div class="form-group">
        <label for="fighter1_id">P1 Fighter</label>
        <select name="fighter1_id" id="fighter1_id" required>
          <option value="">Select fighter...</option>
          {% for f in fighters %}
          <option value="{{ f.id }}" {% if selected_fighter1_id and selected_fighter1_id == (f.id|string) %}selected{% endif %}>
            {{ f.name }}{% if f.llm_model %} — {{ f.llm_model }}{% endif %}
          </option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label for="fighter2_id">P2 Fighter</label>
        <select name="fighter2_id" id="fighter2_id" required>
          <option value="">Select fighter...</option>
          {% for f in fighters %}
          <option value="{{ f.id }}" {% if selected_fighter2_id and selected_fighter2_id == (f.id|string) %}selected{% endif %}>
            {{ f.name }}{% if f.llm_model %} — {{ f.llm_model }}{% endif %}
          </option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="form-group">
      <small class="text-dim">
        Agent and savestate are auto-resolved from fighter configuration and matchup mapping.
      </small>
    </div>

    <div class="grid grid-2">
      <div class="form-group">
        <label for="best_of">Best Of</label>
        <select name="best_of" id="best_of" required>
          <option value="1" {% if best_of == 1 %}selected{% endif %}>1 Round</option>
          <option value="3" {% if best_of == 3 %}selected{% endif %}>Best of 3</option>
          <option value="5" {% if best_of == 5 %}selected{% endif %}>Best of 5</option>
        </select>
      </div>
      <div class="form-group">
        <label for="label">Match Label</label>
        <input type="text" name="label" id="label" value="{{ label or 'MK4-Classic' }}" placeholder="e.g. MK4-Classic, Tournament Round 1">
      </div>
    </div>

    <div class="mt-2">
      <button type="submit" class="btn btn-accent">Create Match</button>
      <a href="/admin/matches" class="btn" style="margin-left: 0.5rem;">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
