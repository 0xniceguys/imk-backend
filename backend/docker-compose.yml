services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: imk
      POSTGRES_PASSWORD: imk_dev_password
      POSTGRES_DB: immortalkombat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imk -d immortalkombat"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
