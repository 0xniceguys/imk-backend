<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IMK Stream Tester</title>
<style>
  body { background: #0a0a0a; color: #fff; font-family: monospace; margin: 0; padding: 20px; }
  h1 { color: #f0b429; }
  #controls { margin: 10px 0; }
  input { background: #222; color: #fff; border: 1px solid #444; padding: 6px 10px; width: 360px; font-family: monospace; }
  button { background: #f0b429; color: #000; border: none; padding: 7px 18px; cursor: pointer; font-weight: bold; margin-left: 8px; }
  button:hover { background: #ffd06e; }
  #status { margin: 8px 0; font-size: 13px; color: #aaa; }
  .live { color: #4ade80; }
  .dead { color: #f87171; }
  #stats { display: flex; gap: 24px; margin: 12px 0; }
  .stat { background: #1a1a1a; border: 1px solid #333; padding: 10px 18px; border-radius: 6px; text-align: center; min-width: 80px; }
  .stat .val { font-size: 28px; font-weight: bold; color: #f0b429; }
  .stat .lbl { font-size: 11px; color: #888; margin-top: 2px; }
  #frame-display { position: relative; display: inline-block; margin-top: 10px; }
  #frame { border: 2px solid #333; display: block; image-rendering: pixelated; }
  #overlay { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,0.7); padding: 4px 10px; border-radius: 4px; font-size: 14px; font-weight: bold; color: #4ade80; }
  #log { background: #111; border: 1px solid #222; padding: 10px; height: 100px; overflow-y: auto; font-size: 11px; color: #666; margin-top: 10px; }
</style>
</head>
<body>
<h1>⚡ IMK Stream Tester</h1>
<div id="controls">
  <input id="wsUrl" type="text" value="ws://localhost:8000/ws/match/" placeholder="ws://localhost:8000/ws/match/{id}" />
  <button onclick="connect()">Connect</button>
  <button onclick="disconnect()" style="background:#555;color:#fff">Disconnect</button>
</div>
<div id="status">Status: <span id="statusText" class="dead">Disconnected</span></div>

<div id="stats">
  <div class="stat"><div class="val" id="fps">0</div><div class="lbl">FPS</div></div>
  <div class="stat"><div class="val" id="frameCount">0</div><div class="lbl">Frames</div></div>
  <div class="stat"><div class="val" id="kbps">0</div><div class="lbl">KB/s</div></div>
  <div class="stat"><div class="val" id="latency">0ms</div><div class="lbl">Frame size</div></div>
</div>

<div id="frame-display">
  <canvas id="frame" width="640" height="480"></canvas>
  <div id="overlay" id="fpsOverlay">-- FPS</div>
</div>

<div id="log" id="logBox"></div>

<script>
let ws = null;
let frameCount = 0;
let totalBytes = 0;
let frameTimestamps = [];
let startTime = Date.now();

const canvas = document.getElementById('frame');
const ctx = canvas.getContext('2d');

function log(msg) {
  const box = document.getElementById('log');
  const d = new Date().toLocaleTimeString();
  box.innerHTML += `[${d}] ${msg}<br>`;
  box.scrollTop = box.scrollHeight;
}

function connect() {
  const url = document.getElementById('wsUrl').value.trim();
  if (!url || url.endsWith('/')) { log('Enter a valid WS URL with match ID'); return; }
  disconnect();
  log(`Connecting to ${url}`);
  ws = new WebSocket(url);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    document.getElementById('statusText').textContent = 'Connected ✓';
    document.getElementById('statusText').className = 'live';
    frameCount = 0; totalBytes = 0; frameTimestamps = []; startTime = Date.now();
    log('Connected! Waiting for frames...');
  };

  ws.onmessage = (e) => {
    if (!(e.data instanceof ArrayBuffer)) return; // skip JSON

    const bytes = e.data.byteLength;
    totalBytes += bytes;
    frameCount++;
    const now = Date.now();
    frameTimestamps.push(now);

    // Keep only last 60 timestamps for FPS calc
    if (frameTimestamps.length > 60) frameTimestamps.shift();

    // Calculate FPS over last 60 frames
    let fps = 0;
    if (frameTimestamps.length >= 2) {
      const elapsed = (frameTimestamps[frameTimestamps.length-1] - frameTimestamps[0]) / 1000;
      fps = Math.round((frameTimestamps.length - 1) / elapsed);
    }

    // Elapsed seconds for overall throughput
    const elapsedSec = (now - startTime) / 1000;
    const kbps = Math.round(totalBytes / 1024 / elapsedSec);

    // Update stats
    document.getElementById('fps').textContent = fps;
    document.getElementById('frameCount').textContent = frameCount;
    document.getElementById('kbps').textContent = kbps;
    document.getElementById('latency').textContent = Math.round(bytes/1024) + 'KB';
    document.getElementById('overlay').textContent = fps + ' FPS';

    // Render JPEG frame
    const blob = new Blob([e.data], {type: 'image/jpeg'});
    const imgUrl = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      canvas.width = img.width * 2;
      canvas.height = img.height * 2;
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(imgUrl);
    };
    img.src = imgUrl;
  };

  ws.onclose = (e) => {
    document.getElementById('statusText').textContent = `Closed (code=${e.code})`;
    document.getElementById('statusText').className = 'dead';
    log(`Closed: code=${e.code} reason=${e.reason}`);
  };

  ws.onerror = () => {
    log('WebSocket error — check backend is running');
    document.getElementById('statusText').textContent = 'Error';
    document.getElementById('statusText').className = 'dead';
  };
}

function disconnect() {
  if (ws) { ws.close(); ws = null; }
}
</script>
</body>
</html>
