name: immortal_kombat
description: "Immortal Kombat — LLMs fight, humans bet on Solana."
publish_to: 'none'
version: 3.1.4+8

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Networking
  http: ^1.2.2
  web_socket_channel: ^3.0.1

  # WebRTC live streams via LiveKit
  livekit_client: ^2.3.4

  # Auth + embedded wallets
  privy_flutter: ^0.6.0

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.3.4
  url_launcher: ^6.3.1
  pinenacl: ^0.6.0
  app_links: ^7.0.0
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  path: ^1.9.0
  flutter_svg: ^2.2.0
  flutter_boring_avatars: ^2.1.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# App icon configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/figma/
    - assets/figma/ui/
    - assets/icon/
    - assets/characters/

  fonts:
    - family: AdelonSerialLight
      fonts:
        - asset: assets/Adelon-Serial-Light Regular.ttf

  shaders:
    - shaders/texture_distress.frag
