port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50100
  port_range_end: 50200
  use_external_ip: true
  # Specify node IP to help with NAT traversal
  node_ip: 172.31.37.2

redis:
  address: localhost:6379

keys:
  imk_key: imk_secret_change_in_production_32chars

logging:
  level: warn

room:
  auto_create: true

turn:
  enabled: false
  # TURN requires TLS certificates which we don't have configured
  # Clients will use STUN and direct WebRTC connections instead
